name: Release Sharlayan 9

# Pushes/merges to main publish a STABLE release. Pull requests targeting main
# publish a PRERELEASE (X.Y.Z-prerelease.N) — but only when the PR comes from a
# branch in this repo and is authored by a maintainer (Icehunter or
# logicallysynced); other PRs build via ci.yml only and publish nothing.
# (The old model keyed prerelease off the sharlayan-9-rebuild branch, which
# stopped producing prereleases when that branch was deleted on merge.)
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: windows-latest

    # Maintainer gate for prerelease publishing from PRs: same-repo head only
    # (forks get no OIDC token anyway), the PR author must be allowlisted, AND
    # the actor who triggered this run (the pusher, on synchronize events) must
    # be allowlisted — author alone would let any collaborator publish by
    # pushing to a maintainer-authored PR branch. Push and manual dispatch runs
    # are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["Icehunter", "logicallysynced"]'), github.event.pull_request.user.login) &&
       contains(fromJSON('["Icehunter", "logicallysynced"]'), github.actor))

    # Matches the Environment constraint on the nuget.org trusted publisher.
    environment: production

    permissions:
      id-token: write  # required for NuGet trusted publishing (OIDC)
      contents: read

    env:
      SOLUTION_NAME: Sharlayan

    steps:
      # FFXIVClientStructs is a git submodule. submodules: recursive ensures it
      # is fully initialised; fetch-depth: 0 keeps full history for any version
      # scripts that inspect git tags.
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On pull_request, pin the PR HEAD rather than the default ephemeral
          # merge ref — the published prerelease must be exactly the pushed
          # code, not a synthetic merge with whatever main's tip happens to be.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      # Derive the NuGet version from version.props and the trigger:
      #   push to main / workflow_dispatch → 9.2.0                (stable)
      #   pull_request into main           → 9.2.0-prerelease.N   (N = run number)
      #
      # The eventual stable release supersedes all prior X.Y.Z-prerelease.*
      # packages — standard NuGet SemVer promotion, no special handling needed.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content -Path ".\${{ env.SOLUTION_NAME }}\version.props" -Raw
          $major = [regex]::Match($props, '<VersionMajor>(\d+)').Groups[1].Value
          $minor = [regex]::Match($props, '<VersionMinor>(\d+)').Groups[1].Value
          $patch = [regex]::Match($props, '<VersionPatch>(\d+)').Groups[1].Value
          if (-not $major -or -not $minor -or -not $patch) {
              throw 'Could not parse version from version.props'
          }

          $base   = "$major.$minor.$patch"
          $branch = '${{ github.ref_name }}'
          $isPrerelease = '${{ github.event_name }}' -eq 'pull_request'
          $full   = if ($isPrerelease) { "$base-prerelease.${{ github.run_number }}" } else { $base }

          Write-Host "Branch      : $branch"
          Write-Host "Base version: $base"
          Write-Host "Full version: $full"
          Write-Host "Prerelease  : $isPrerelease"

          "base=$base"                                   | Out-File $env:GITHUB_OUTPUT -Append
          "full=$full"                                   | Out-File $env:GITHUB_OUTPUT -Append
          "is_prerelease=$($isPrerelease.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

      # build.ps1:
      #   1. Builds FFXIVClientStructs (source generators → DLLs at the HintPath
      #      location Sharlayan.csproj references).
      #   2. Builds Sharlayan + runs ILRepack (merges FCS into Sharlayan.dll).
      #   3. Packs the NuGet package (GeneratePackageOnBuild=true) and the
      #      CopyPackages MSBuild target drops it under .\published\.
      #
      # -SkipSubmoduleUpdate: checkout already initialised the submodule; running
      # `git submodule update --remote` again under GITHUB_TOKEN can fail if the
      # .gitmodules URL is SSH-flavoured.
      # -Version: injects the computed SemVer so the .nupkg carries the right id.
      - name: Build (FFXIVClientStructs → Sharlayan → ILRepack → NuGet pack)
        shell: pwsh
        run: |
          ./build.ps1 `
            -Configuration Release `
            -SkipSubmoduleUpdate `
            -Version '${{ steps.version.outputs.full }}'

      # Sharlayan.Tests exercises mapper offset derivation and signature extractor
      # math — pure logic, no live FFXIV client required.
      # -p:GeneratePackageOnBuild=false prevents the test-triggered rebuild of
      # Sharlayan from packing a second nupkg with the default (non-prerelease)
      # version from version.props, which would otherwise land in published/
      # and get pushed to NuGet alongside the correct prerelease.
      - name: Run tests
        shell: pwsh
        run: |
          dotnet test Sharlayan.Tests/Sharlayan.Tests.csproj `
            --configuration Release `
            --nologo `
            --logger "console;verbosity=normal" `
            -p:GeneratePackageOnBuild=false

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sharlayan-${{ steps.version.outputs.full }}
          path: published/
          if-no-files-found: error
          overwrite: true

      # Publish stable releases from main pushes; publish prereleases from
      # maintainer PRs. Uses NuGet Trusted Publishing (OIDC) via the official NuGet/login
      # action — no stored API key needed. nuget.org must have this repo
      # configured as a trusted publisher for the Sharlayan package. The
      # temporary API key is valid for ~1 hour. --skip-duplicate makes re-runs
      # a no-op on the same version.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: Icehunter  # nuget.org username (profile name) that owns the Sharlayan package

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -Path .\published\ -Filter *.nupkg
          if (-not $packages) { throw 'No .nupkg files found under .\published\' }
          foreach ($pkg in $packages) {
              Write-Host "==> Publishing $($pkg.Name)"
              dotnet nuget push $pkg.FullName `
                  --skip-duplicate `
                  --api-key $env:NUGET_API_KEY `
                  --source https://api.nuget.org/v3/index.json
          }
